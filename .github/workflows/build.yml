name: build-caddy-coraza

# Builds a Caddy binary with the OWASP Coraza WAF module compiled in.
# Targets the exact Caddy version running on joyboy (v2.11.7) so the
# Caddyfile stays valid and no standard module goes missing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version (e.g. v2.11.7)'
        required: false
        default: 'v2.11.7'
      coraza_version:
        description: 'coraza-caddy version (e.g. v2.6.2)'
        required: false
        default: 'v2.6.2'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CADDY_VERSION: ${{ github.event.inputs.caddy_version || 'v2.11.7' }}
  CORAZA_VERSION: ${{ github.event.inputs.coraza_version || 'v2.6.2' }}
  XCADDY_VERSION: v0.4.7
  GO_VERSION: '1.26.11'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Show toolchain
        run: |
          go version
          echo "caddy=${CADDY_VERSION} coraza=${CORAZA_VERSION} xcaddy=${XCADDY_VERSION}"

      - name: Install xcaddy
        run: |
          go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          xcaddy build "${CADDY_VERSION}" \
            --output ./caddy \
            --with "github.com/corazawaf/coraza-caddy/v2@${CORAZA_VERSION}"

      - name: Verify
        run: |
          set -euo pipefail
          echo "--- caddy version ---"
          ./caddy version

          echo "--- build-info (embedded module versions) ---"
          ./caddy build-info > build-info.txt
          grep -E 'caddyserver/caddy/v2|coraza' build-info.txt

          echo "--- module list ---"
          ./caddy list-modules --packages > modules.txt
          echo "module count: $(wc -l < modules.txt)"
          echo "coraza modules:"
          grep -i coraza modules.txt || { echo 'FAIL: coraza module not registered'; exit 1; }

          echo "--- required standard modules still present ---"
          for m in http.handlers.reverse_proxy http.handlers.file_server \
                   http.handlers.encode http.matchers.host http.encoders.gzip; do
            grep -q "^${m} " modules.txt || { echo "FAIL: missing module ${m}"; exit 1; }
          done

          echo "--- functional check: CRS loads from embedded ruleset ---"
          cat > Caddyfile.test <<'CFEOF'
          {
          	order coraza_waf first
          	admin off
          }
          :18080 {
          	coraza_waf {
          		load_owasp_crs
          		directives `
          			Include @coraza.conf-recommended
          			Include @crs-setup.conf.example
          			Include @owasp_crs/*.conf
          			SecRuleEngine DetectionOnly
          		`
          	}
          	respond "ok" 200
          }
          CFEOF
          ./caddy validate --config Caddyfile.test --adapter caddyfile
          echo "validate: OK"

          echo "--- binary ---"
          file ./caddy
          ls -l ./caddy
          sha256sum ./caddy > caddy.sha256
          cat caddy.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-coraza-${{ env.CADDY_VERSION }}-${{ env.CORAZA_VERSION }}
          path: |
            caddy
            caddy.sha256
            modules.txt
            build-info.txt
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            ./caddy ./caddy.sha256 ./modules.txt ./build-info.txt \
            --title "caddy ${CADDY_VERSION} + coraza ${CORAZA_VERSION}" \
            --notes "Caddy ${CADDY_VERSION} with OWASP Coraza WAF ${CORAZA_VERSION} compiled in.

          - Go ${GO_VERSION}, CGO_ENABLED=0, linux/amd64
          - OWASP CRS is embedded in the binary: use \`load_owasp_crs\` and \`Include @owasp_crs/*.conf\`
          - Verify: \`sha256sum -c caddy.sha256\`
          - Module inventory: \`modules.txt\`
          - Embedded versions: \`build-info.txt\`"
